# Rebuilds the whole pipeline on a clean Ubuntu runner and fails if any committed table, the panel, the
# codebook or the README changes. Figures are not compared: PNG bytes differ across platforms (font
# rendering) even when the plotted data are identical.
name: rebuild

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python dependencies
        run: python -m venv .venv && .venv/bin/pip install -r requirements.txt
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-r-${{ hashFiles('R/install_packages.R') }}
      - name: R dependencies
        run: Rscript R/install_packages.R
      - name: Rebuild everything
        run: make all
      - name: Committed outputs must be reproduced exactly
        run: |
          if ! git diff --quiet -- outputs/tables data/processed README.md; then
            echo "Rebuilt files differ from the committed copies:"
            git --no-pager diff --stat -- outputs/tables data/processed README.md
            git --no-pager diff -- outputs/tables data/processed README.md | head -200
            exit 1
          fi
